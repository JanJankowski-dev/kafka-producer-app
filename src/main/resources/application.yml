server:
  port: 8080

app:
  private-http:
    enabled: ${APP_REQUIRE_AUTH:false}
    deployment: ${APP_DEPLOYMENT_MODE:false}
    user: ${APP_HTTP_USER:}
    password: ${APP_HTTP_PASSWORD:}
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    external-market-data-sharing-allowed: ${APP_EXTERNAL_MARKET_DATA_SHARING_ALLOWED:false}
  market-data:
    local-mode: ${MARKET_DATA_LOCAL_MODE:false}
    eodhd-token: ${EODHD_API_KEY:}
    daily-enabled: ${MARKET_DAILY_ENABLED:false}
  kafka:
    topic: investment.order-proposals.v1
  outbox:
    enabled: true
    batch-size: 50
    poll-delay-ms: 1000
    lease-duration: 30s
    max-attempts: 5
    retry-base-delay: 2s
    retry-max-delay: 1m

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investment_portfolio}
    username: ${DB_USER:investment}
    password: ${DB_PASSWORD:investment}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jooq:
    sql-dialect: POSTGRES
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
