server:
  port: 8080

app:
  kafka:
    topic: investment.order-proposals.v1

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investment_portfolio}
    username: ${DB_USER:investment}
    password: ${DB_PASSWORD:investment}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jooq:
    sql-dialect: POSTGRES
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 30000
        "[request.timeout.ms]": 10000
