plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.10'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jooq.jooq-codegen-gradle' version '3.19.29'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Application to produce events'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.liquibase:liquibase-core'
	jooqCodegen 'org.jooq:jooq-meta-extensions:3.19.29'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jooq {
	configuration {
		generator {
				database {
					name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
					includes = 'order_proposals|order_proposal_evidence_sources|outbox_events|idempotency_requests|market_snapshots|market_instruments|market_daily_closes|screening_runs|screening_signals|paper_portfolios|paper_cash|paper_positions|paper_trades|paper_orders|market_import_batches|market_import_bars|strategy_comparisons|paper_daily_valuations|paper_auto_decisions|paper_auto_orders|etf_benchmark_navs|etf_benchmark_market_closes'
					forcedTypes {
						forcedType {
							name = 'JSONB'
							includeExpression = '.*\\.outbox_events\\.payload'
						}
					}
					properties {
					property {
						key = 'scripts'
						value = 'src/main/resources/db/changelog/changes/*.sql'
					}
					property {
						key = 'sort'
						value = 'semantic'
					}
					property {
						key = 'unqualifiedSchema'
						value = 'none'
					}
					property {
						key = 'defaultNameCase'
						value = 'lower'
					}
				}
			}
			generate {
				deprecated = false
				records = true
			}
			target {
				packageName = 'com.example.producer.jooq'
				directory = 'build/generated-src/jooq/main'
			}
		}
	}
}

tasks.named('compileJava') {
	dependsOn(tasks.named('jooqCodegen'))
}

tasks.named('processResources') {
	from('frontend/dist') {
		into 'static'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
